apiVersion: apps/v1
kind: Deployment
metadata:
  name: livora
  labels:
    app: livora
    app.kubernetes.io/name: livora
    app.kubernetes.io/component: fullstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livora
  template:
    metadata:
      labels:
        app: livora
    spec:
      containers:
        - name: livora
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15

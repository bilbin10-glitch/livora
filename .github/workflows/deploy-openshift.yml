name: Build & Deploy to Red Hat OpenShift Sandbox

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build Container & Deploy to OpenShift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout Source Code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Extract Metadata & Tags for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Step 5: Build and Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 6: Authenticate with Red Hat OpenShift Sandbox
      - name: Log in to OpenShift Cluster
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}
          insecure_skip_tls_verify: true

      # Step 7: Configure ImagePullSecret for Private GHCR Image (if needed)
      - name: Configure Image Pull Secret for OpenShift
        run: |
          IMAGE_LOWERCASE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Create or update GHCR pull secret in OpenShift
          oc create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --docker-email="${{ github.actor }}@users.noreply.github.com" \
            --dry-run=client -o yaml | oc apply -f -
          
          # Link pull secret to default serviceaccount
          oc secrets link default ghcr-pull-secret --for=pull || true

      # Step 8: Deploy Manifests to OpenShift
      - name: Deploy to OpenShift
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          IMAGE_TAG_LOWER=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
          
          echo "Deploying image: $IMAGE_TAG_LOWER"
          
          # Replace placeholder with actual image name
          sed -i "s|image: IMAGE_PLACEHOLDER|image: $IMAGE_TAG_LOWER|g" openshift/deployment.yaml
          
          # Apply Kubernetes/OpenShift resources
          oc apply -f openshift/
          
          # Wait for deployment rollout
          oc rollout status deployment/livora --timeout=180s

      # Step 9: Output the Public OpenShift URL
      - name: Show Live Application Route URL
        run: |
          ROUTE_HOST=$(oc get route livora -o jsonpath='{.spec.host}' 2>/dev/null || echo "Route creating...")
          echo "==============================================================="
          echo "🚀 LIVORA LIVE ON OPENSHIFT SANDBOX:"
          echo "🌐 URL: https://$ROUTE_HOST"
          echo "==============================================================="

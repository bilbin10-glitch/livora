name: Build & Deploy to Red Hat OpenShift Sandbox

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build Container & Deploy to OpenShift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout Source Code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Extract Metadata & Tags for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Step 5: Build and Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 6: Install OpenShift CLI (oc)
      - name: Install OpenShift CLI (oc)
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.14"

      # Step 7: Authenticate with Red Hat OpenShift Sandbox
      - name: Log in to OpenShift Cluster
        env:
          SERVER_RAW: ${{ secrets.OPENSHIFT_SERVER }}
          TOKEN_RAW: ${{ secrets.OPENSHIFT_TOKEN }}
          NAMESPACE_RAW: ${{ secrets.OPENSHIFT_NAMESPACE }}
        run: |
          # Clean inputs (strip leading/trailing whitespace, quotes, or accidental newlines)
          CLEAN_SERVER=$(echo "$SERVER_RAW" | tr -d ' "\r\n')
          CLEAN_TOKEN=$(echo "$TOKEN_RAW" | tr -d ' "\r\n')
          CLEAN_NS=$(echo "$NAMESPACE_RAW" | tr -d ' "\r\n')

          if [ -z "$CLEAN_SERVER" ] || [ -z "$CLEAN_TOKEN" ]; then
            echo "❌ ERROR: OPENSHIFT_SERVER or OPENSHIFT_TOKEN is empty in GitHub Secrets."
            echo "Please check repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Attempting oc login to server: $CLEAN_SERVER"
          oc login --token="$CLEAN_TOKEN" --server="$CLEAN_SERVER" --insecure-skip-tls-verify=true
          
          if [ -n "$CLEAN_NS" ]; then
            echo "Switching to namespace: $CLEAN_NS"
            oc project "$CLEAN_NS" || true
          fi
          
          echo "✓ Successfully authenticated with OpenShift as:"
          oc whoami

      # Step 8: Configure ImagePullSecret for GHCR Image
      - name: Configure Image Pull Secret for OpenShift
        run: |
          IMAGE_LOWERCASE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Create or update GHCR pull secret in OpenShift
          oc create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --docker-email="${{ github.actor }}@users.noreply.github.com" \
            --dry-run=client -o yaml | oc apply -f -
          
          # Link pull secret to default serviceaccount
          oc secrets link default ghcr-pull-secret --for=pull || true

      # Step 9: Deploy Manifests to OpenShift
      - name: Deploy to OpenShift
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          IMAGE_TAG_LOWER=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
          
          echo "Deploying image: $IMAGE_TAG_LOWER"
          
          # Replace placeholder with actual image name
          sed -i "s|image: IMAGE_PLACEHOLDER|image: $IMAGE_TAG_LOWER|g" openshift/deployment.yaml
          
          # Apply Kubernetes/OpenShift resources
          oc apply -f openshift/
          
          # Trigger rollout restart
          oc rollout restart deployment/livora || true
          
          # Wait for deployment rollout
          oc rollout status deployment/livora --timeout=180s

      # Step 10: Output the Public OpenShift URL
      - name: Show Live Application Route URL
        run: |
          ROUTE_HOST=$(oc get route livora -o jsonpath='{.spec.host}' 2>/dev/null || echo "Route creating...")
          echo "==============================================================="
          echo "🚀 LIVORA LIVE ON OPENSHIFT SANDBOX:"
          echo "🌐 URL: https://$ROUTE_HOST"
          echo "==============================================================="
